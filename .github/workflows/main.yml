name: Build and Deploy Website

on:
  push:
    branches:
      - main  # Runs every time Lovable updates your code

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build static files
        run: npm run build

      - name: Deploy Build to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder Lovable projects compile into
          branch: gh-pages # Pushes the live compiled code here
